name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            artifact: apple-music-windows.zip
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            artifact: apple-music-linux.zip
          - name: macos-arm64
            os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            artifact: apple-music-macos.zip
          - name: android-arm64
            os: ubuntu-latest
            platform: android
            target: aarch64-linux-android
            artifact: apple-music-android.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: echo "Using pre-installed NDK $ANDROID_NDK_LATEST_HOME"

      - name: Configure Android cross compilation
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -n1)}"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android21-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and package module
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'windows') {
            $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            if ($vsPath) {
              cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && pwsh -NoProfile -Command `"./scripts/package.ps1 -Platform ${{ matrix.platform }} -Target ${{ matrix.target }}`""
            } else {
              ./scripts/package.ps1 -Platform ${{ matrix.platform }} -Target ${{ matrix.target }}
            }
          } else {
            ./scripts/package.ps1 -Platform ${{ matrix.platform }} -Target ${{ matrix.target }}
          }

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download module artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
